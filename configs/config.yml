# General Settings
experiment_name: "sc_std_v1"
seed: 42
device: "cuda"
num_workers: 4

# Data Paths
data:
  dataset_name: "NSD"
  data_root: "/media/hung/data1/codes/imge2fmri/NSD"  # Adjust this path to your actual NSD root
  stimuli_path: "/media/hung/data1/codes/imge2fmri/NSD/stimuli" # Adjust to where images are
  fmri_path: "/media/hung/data1/codes/imge2fmri/NSD/fmri" # Adjust to where fmri .nii/.npy are
  train_split: "train_split.csv" # Path to CSV defining train split
  val_split: "val_split.csv"
  img_size: 256  # Size to resize stimuli images
  fmri_resolution: [64, 64, 64] # Resolution to resize fMRI volumes
  num_frames: 10 # Number of timeframes per sequence (T)

# VQ-GAN Settings (Stage 1)
vqgan:
  n_embeddings: 1024
  embedding_dim: 256
  downsample_factor: [4, 4, 4] # Downsampling in [D, H, W]
  n_hiddens: 128
  n_res_layers: 2
  disc_start: 50000
  checkpoint_path: null # Path to pretrained VQGAN, if any

# Diffusion Model Settings (Stage 2)
diffusion:
  model_type: "transformer" # 'unet' or 'transformer'
  transformer:
    depth: 12
    heads: 8
    dim: 512
    mlp_dim: 2048
    dropout: 0.1
  beta_schedule: "linear"
  timesteps: 1000
  clip_model: "ViT-B/32" # For image conditioning
  subject_embedding_dim: 256
  num_subjects: 8 # Number of subjects in NSD

# Training Settings
train:
  batch_size: 4 # Small batch size for 4D/3D data
  learning_rate: 1.0e-4
  epochs: 100
  save_every: 10
  log_every: 100
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  validation_every: 5 # validate every N epochs
