# General Settings
experiment_name: "sc_std_v1"
seed: 42
device: "cuda"
num_workers: 8

# Data Paths
data:
  dataset_name: "NSD"
  data_root: "./NSD/data" 
  stimuli_path: "./NSD/data/nsddata_stimuli/stimuli/nsd/nsd_stimuli.hdf5"
  fmri_root: "./NSD/data/nsddata_timeseries/ppdata" # Root for fMRI subjects
  mask_root: "./NSD/data/nsddata/ppdata" # Root for masks
  exp_design_path: "./NSD/data/nsddata/experiments/nsd/nsd_expdesign.mat"
  train_split: "train_split.csv" # Placeholder
  val_split: "val_split.csv" # Placeholder
  img_size: 256  
  fmri_resolution: [64, 64, 64] 
  num_frames: 2 #4

# VQ-GAN Settings (Stage 1)
vqgan:
  n_embeddings: 1024
  embedding_dim: 256
  downsample_factor: [4, 4, 4] 
  n_hiddens: 64 #128
  n_res_layers: 2
  disc_start: 50000
  checkpoint_path: null 

# Diffusion Model Settings (Stage 2)
diffusion:
  model_type: "transformer" 
  transformer:
    depth: 12
    heads: 8
    dim: 512
    mlp_dim: 2048
    dropout: 0.1
  beta_schedule: "linear"
  timesteps: 1000
  clip_model: "ViT-B/32" 
  subject_embedding_dim: 256
  num_subjects: 8 

# Training Settings
train:
  batch_size: 1 # 4D data is heavy
  learning_rate: 1.0e-4
  epochs: 100
  save_every: 500 # steps
  log_every: 50
  accumulate_grad_batches: 8 # Effective batch size = 8
  gradient_clip_val: 1.0
  validation_every: 5 # epochs
